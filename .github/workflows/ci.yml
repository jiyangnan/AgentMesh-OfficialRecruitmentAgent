name: 公开客户端质量门槛

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "946684800"
  PYTHONHASHSEED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: 拒绝公开内部仓库拓扑
        run: |
          if git grep -nE '^#{1,6}[[:space:]]+(仓库关系|多仓关系|仓库拓扑)$'; then
            exit 1
          fi
          if git grep -nE 'github\.com/jiyangnan/' | grep -v 'AgentMesh-OfficialRecruitmentAgent'; then
            exit 1
          fi

      - name: 安装与测试
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests
          pytest

      - name: 构建公开客户端资产
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python scripts/package_extension.py \
            --source extension \
            --output dist/agentmesh-officialrecruitment-extension.zip \
            --release-manifest dist/agentmesh-officialrecruitment-extension-release.json \
            --production

      - name: 准备跨平台安装验收资产
        run: |
          mkdir -p ci-install-assets/downloads/agentmesh-officialrecruitment-skill
          cp dist/official_recruitment_agent-*.whl \
            ci-install-assets/downloads/official-recruitment-agent.whl
          cp dist/agentmesh-officialrecruitment-extension.zip \
            ci-install-assets/downloads/agentmesh-officialrecruitment-extension.zip
          cp dist/agentmesh-officialrecruitment-extension-release.json \
            ci-install-assets/downloads/agentmesh-officialrecruitment-extension-release.json
          cp skills/agentmesh-officialrecruitment/SKILL.md \
            ci-install-assets/downloads/agentmesh-officialrecruitment-skill/SKILL.md
          cp installer/install-agent.sh installer/install-agent.ps1 \
            ci-install-assets/
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import re

          root = Path("ci-install-assets")
          powershell = (root / "install-agent.ps1").read_text(encoding="utf-8")
          expected_adapter = re.search(
              r'\$AdapterSha256 = "([0-9a-f]{64})"', powershell
          )
          expected_skill = re.search(
              r'\$SkillSha256 = "([0-9a-f]{64})"', powershell
          )
          assert expected_adapter is not None
          assert expected_skill is not None
          actual_adapter = hashlib.sha256(
              (root / "downloads" / "official-recruitment-agent.whl").read_bytes()
          ).hexdigest()
          actual_skill = hashlib.sha256(
              (
                  root
                  / "downloads"
                  / "agentmesh-officialrecruitment-skill"
                  / "SKILL.md"
              ).read_bytes()
          ).hexdigest()
          assert actual_adapter == expected_adapter.group(1)
          assert actual_skill == expected_skill.group(1)
          PY

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: public-install-assets
          path: ci-install-assets
          if-no-files-found: error
          retention-days: 1

      - name: 拒绝私有服务端路径
        run: |
          test ! -e migrations
          test ! -e web/src
          test ! -e src/official_recruitment_agent/workbench/api.py
          test ! -e src/official_recruitment_agent/workbench/service.py

  windows-client:
    name: Windows 客户端与 PowerShell
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装与测试
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests
          python -m pytest

      - uses: actions/download-artifact@v8.0.1
        with:
          name: public-install-assets
          path: ${{ runner.temp }}/site

      - name: 解析 PowerShell 安装器
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "installer/install-agent.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: 真实执行 Windows 安装与扩展准备
        shell: pwsh
        run: |
          $Site = Join-Path $env:RUNNER_TEMP "site"

          $Port = 18127
          $HttpServer = Start-Process python `
            -ArgumentList @(
              "-m", "http.server", "$Port", "--bind", "127.0.0.1",
              "--directory", $Site
            ) `
            -PassThru `
            -WindowStyle Hidden
          try {
            $Ready = $false
            for ($Attempt = 0; $Attempt -lt 20; $Attempt++) {
              try {
                Invoke-WebRequest -UseBasicParsing `
                  -Uri "http://127.0.0.1:$Port/downloads/official-recruitment-agent.whl" `
                  -Method Head | Out-Null
                $Ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $Ready) {
              throw "Windows 安装测试服务未就绪。"
            }

            $env:ORA_INSTALL_BASE_URL = "http://127.0.0.1:$Port"
            $env:ORA_AGENT_HOME = Join-Path $env:RUNNER_TEMP "ora-agent-home"
            $env:ORA_BIN_DIR = Join-Path $env:RUNNER_TEMP "ora-bin"
            $env:ORA_SKILLS_DIR = Join-Path $env:RUNNER_TEMP "ora-skills"
            & (Join-Path $Site "install-agent.ps1")

            $Current = Get-Content -Raw -Encoding UTF8 `
              (Join-Path $env:ORA_AGENT_HOME "current.json") |
              ConvertFrom-Json
            $Cli = $Current.cli_path
            $ExtensionDir = Join-Path $env:LOCALAPPDATA `
              "AgentMesh360\OfficialRecruitment\extension-ci"
            if (-not (Test-Path $Cli)) {
              throw "Windows CLI 安装结果不存在。"
            }
            if (-not (Test-Path (Join-Path $env:ORA_BIN_DIR "ora-workbench.cmd"))) {
              throw "Windows CLI 命令入口不存在。"
            }
            if (-not (Test-Path (Join-Path $env:ORA_SKILLS_DIR "agentmesh-officialrecruitment\SKILL.md"))) {
              throw "Windows Skill 安装结果不存在。"
            }

            & $Cli `
              --base-url "http://127.0.0.1:$Port" `
              extension prepare `
              --install-dir $ExtensionDir `
              --no-open
            if ($LASTEXITCODE -ne 0) {
              throw "Windows 扩展准备失败。"
            }
            $Status = (& $Cli extension status --install-dir $ExtensionDir) |
              ConvertFrom-Json
            if (-not $Status.healthy -or $Status.status -ne "ready") {
              throw "Windows 扩展状态未达到 ready。"
            }
            if ($Status.platform -ne "windows") {
              throw "Windows 扩展状态平台标识错误。"
            }
          } finally {
            Stop-Process -Id $HttpServer.Id -Force -ErrorAction SilentlyContinue
          }
