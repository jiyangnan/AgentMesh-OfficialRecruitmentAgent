[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "official-recruitment-agent"
version = "0.1.7"
description = "Public host-agent adapter for AgentMesh-OfficialRecruitment"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[project.scripts]
ora-workbench = "official_recruitment_agent.workbench_cli:main"
ora-native-host = "official_recruitment_agent.native_messaging:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
