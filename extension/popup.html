<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>官网申请填写器</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="mark">AM</span>
      <span>
        <strong>官网申请填写器</strong>
        <small id="connection">尚未连接 AgentMesh360</small>
      </span>
      <button id="disconnect" class="header-button" type="button" hidden>
        断开
      </button>
    </header>
    <main>
      <section id="setup">
        <form id="connection-form">
          <button class="primary" type="submit">连接本机 Agent</button>
        </form>
        <p class="setup-note">
          本机 Agent 会自动完成账户连接，扩展不会读取或保存通用 API Key。
        </p>
      </section>
      <section id="assist" hidden>
        <form id="task-form">
          <button id="observe" class="primary" type="submit">
            识别当前步骤
          </button>
        </form>
      </section>
      <section id="review" hidden>
        <div class="summary">
          <span>
            <small id="step-label">当前步骤</small>
            <strong id="target-origin"></strong>
          </span>
          <span class="count" id="field-count">0</span>
        </div>
        <div id="field-list" class="field-list"></div>
        <p class="boundary">
          附件、验证码、声明、下一步和最终提交保持手动。
        </p>
        <label class="review-approval">
          <input id="review-approved" type="checkbox" disabled />
          <span>我已核对以上预览</span>
        </label>
        <div class="actions">
          <button id="undo" class="secondary" type="button" disabled>
            撤销本次填写
          </button>
          <button id="execute" class="primary" type="button" disabled>
            确认填写
          </button>
        </div>
      </section>
      <p id="message" class="message" hidden></p>
      <nav class="popup-footer" aria-label="工作台入口">
        <button id="open-workbench" class="workbench-link" type="button" disabled>
          <span>前往工作台</span>
          <span aria-hidden="true">→</span>
        </button>
      </nav>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
