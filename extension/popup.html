<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="官网申请填写器">Career-site form assistant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="mark">AM</span>
      <span class="product-name">
        <strong data-i18n="官网申请填写器">Career-site form assistant</strong>
        <small id="connection" data-i18n="尚未连接 AgentMesh360">Not connected to AgentMesh360</small>
      </span>
      <span class="header-tools">
        <span class="language-switcher" data-i18n-aria="语言">
          <button type="button" data-locale="zh-CN" aria-pressed="false">中</button>
          <button type="button" data-locale="en" aria-pressed="true">EN</button>
          <button type="button" data-locale="ja" aria-pressed="false">日</button>
          <button type="button" data-locale="ko" aria-pressed="false">한</button>
        </span>
        <button id="disconnect" class="header-button" type="button" hidden data-i18n="断开">
          Disconnect
        </button>
      </span>
    </header>
    <main>
      <section id="setup">
        <form id="connection-form">
          <button class="primary" type="submit" data-i18n="连接本机 Agent">Connect local Agent</button>
        </form>
        <p class="setup-note" data-i18n="本机 Agent 会自动完成账户连接，扩展不会读取或保存通用 API Key。">
          The local Agent completes account linking. The extension never reads or stores your universal API key.
        </p>
      </section>
      <section id="assist" hidden>
        <form id="task-form">
          <button id="observe" class="primary" type="submit" data-i18n="识别当前步骤">
            Inspect current step
          </button>
        </form>
      </section>
      <section id="review" hidden>
        <div class="summary">
          <span>
            <small id="step-label" data-i18n="当前步骤">Current step</small>
            <strong id="target-origin"></strong>
          </span>
          <span class="count" id="field-count">0</span>
        </div>
        <div id="field-list" class="field-list"></div>
        <p class="boundary" data-i18n="附件、验证码、声明、下一步和最终提交保持手动。">
          Attachments, CAPTCHA, declarations, next-step navigation, and final submission remain manual.
        </p>
        <label class="review-approval">
          <input id="review-approved" type="checkbox" disabled />
          <span data-i18n="我已核对以上预览">I reviewed the preview above</span>
        </label>
        <div class="actions">
          <button id="undo" class="secondary" type="button" disabled data-i18n="撤销本次填写">
            Undo this fill
          </button>
          <button id="execute" class="primary" type="button" disabled data-i18n="确认填写">
            Confirm fill
          </button>
        </div>
      </section>
      <p id="message" class="message" hidden></p>
      <nav class="popup-footer" aria-label="工作台入口" data-i18n-aria="工作台入口">
        <button id="open-workbench" class="workbench-link" type="button" disabled>
          <span data-i18n="前往工作台">Open workspace</span>
          <span aria-hidden="true">→</span>
        </button>
      </nav>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
